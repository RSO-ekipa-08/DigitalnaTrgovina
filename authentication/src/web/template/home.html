<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link href="/public/css/app.css" rel="stylesheet" />
    </head>
    <body class="home">
        <nav class="navbar">
            <div class="nav-brand">Digitalna trgovina</div>
            <div class="nav-items"></div>
                <div id="user-section">
                    <a href="/login" id="login-btn" class="btn">Sign In</a>
                    <div id="user-info" style="display: none">
                        <img
                            id="user-avatar"
                            class="avatar"
                            alt="Profile picture"
                        />
                        <span id="user-name"></span>
                        <button onclick="logout()" class="btn">Logout</button>
                    </div>
                </div>
            </nav>div>
        </nav>

        <main>
            <h1>Popularne aplikacije</h1>

            <div class="filters">
                <select id="category-filter">
                    <option value="">Vse kategorije</option>
                </select>
                <div class="price-filter">
                    <input
                        type="number"
                        id="min-price"
                        placeholder="Min cena"
                    />
                    <input
                        type="number"
                        id="max-price"
                        placeholder="Max cena"
                    />
                </div>
                <button onclick="applyFilters()" class="btn">Filtriraj</button>
            </div>

            <div id="apps-grid" class="apps-grid"></div>
                <!-- Apps will be loaded here -->
            </div>
        </main>
        <script>
            // Add service URLs from environment
            window.APP_SERVICE_URL = "{{.AppServiceURL}}";
            window.REVIEWS_SERVICE_URL = "{{.ReviewsServiceURL}}";
        </script>
        <script src="/public/js/auth.js"></script>
        <script src="/public/js/apps.js"></script>
    </body>
</html>
