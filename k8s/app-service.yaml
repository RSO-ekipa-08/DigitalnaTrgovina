apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-service
  namespace: rso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-service
  template:
    metadata:
      labels:
        app: app-service
    spec:
      containers:
      - name: app-service
        image: ghcr.io/rso-ekipa-08/app-service:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: rso-config
        - secretRef:
            name: rso-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rso-secrets
              key: DATABASE_URL
        - name: STORAGE_ENDPOINT
          value: ${STORAGE_ENDPOINT}
        - name: STORAGE_ACCESS_KEY
          value: ${STORAGE_ACCESS_KEY}
        - name: STORAGE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rso-secrets
              key: STORAGE_SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: rso
spec:
  selector:
    app: app-service
  ports:
  - port: 8080
    targetPort: 8080
  type: LoadBalancer  # Ta service bo izpostavljen navzven 