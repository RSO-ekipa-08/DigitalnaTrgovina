apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-service
  namespace: rso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews-service
  template:
    metadata:
      labels:
        app: reviews-service
    spec:
      containers:
      - name: reviews-service
        image: ghcr.io/rso-ekipa-08/reviews:latest
        ports:
        - containerPort: 50051
        envFrom:
        - configMapRef:
            name: rso-config
        - secretRef:
            name: rso-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
          - name: POSTGRES_HOST
            valueFrom:
              configMapKeyRef:
                name: rso-config
                key: DB_HOST
          - name: DATABASE_URL
            value: "postgres://psqladmin:$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/reviews_db"
          - name: POSTGRES_PORT
            value: "5432"
          - name: POSTGRES_USER
            value: "psqladmin"
          - name: POSTGRES_DB
            value: "reviews_db"
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rso-secrets
                key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-service
  namespace: rso
spec:
  selector:
    app: reviews-service
  ports:
  - port: 50051
    targetPort: 50051
  type: ClusterIP 