apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: rso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: ghcr.io/rso-ekipa-08/authentication:latest
        ports:
        - containerPort: 3000
        - containerPort: 50051
        envFrom:
        - configMapRef:
            name: rso-config
        - secretRef:
            name: rso-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
          - name: AUTH0_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: rso-secrets
                key: AUTH0_CLIENT_ID
          - name: AUTH0_DOMAIN
            valueFrom:
              configMapKeyRef:
                name: rso-config
                key: AUTH0_DOMAIN
          - name: AUTH0_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: rso-secrets
                key: AUTH0_CLIENT_SECRET
          - name: AUTH0_CALLBACK_URL
            valueFrom:
              configMapKeyRef:
                name: rso-config
                key: AUTH0_CALLBACK_URL
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: rso
spec:
  selector:
    app: auth-service
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
  - name: http
    port: 80
    targetPort: 3000
  type: LoadBalancer 