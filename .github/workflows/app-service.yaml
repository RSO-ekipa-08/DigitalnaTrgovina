name: Build and Deploy App Service to Azure Kubernetes Service

permissions:
  attestations: write
  id-token: write
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app-service/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        id: push
        with:
          context: ./app-service
          push: true
          tags: ghcr.io/rso-ekipa-08/app-service:latest
      
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/rso-ekipa-08/app-service
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        # with:
        #   version: 'latest'

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    #   - name: Get Kubeconfig
    #     run: az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CLUSTER_NAME }}

      - name: Azure CLI script
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az account show

      - name: Gets K8s context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.RESOURCE_GROUP }}
          cluster-name: ${{ vars.CLUSTER_NAME }}

      # - name: Update Kubernetes Deployment
      #   run: |
      #     kubectl set image deployment/app-service app-service=ghcr.io/${{ github.repository }}/app-service:latest

      - name: Setup K8s Docker Registry Credentials
        uses: azure/k8s-create-secret@v5
        with:
          container-registry-url: ghcr.io
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          secret-name: registry-creds

      - name: Deploy to AKS
        uses: azure/k8s-deploy@v5
        with:
          # action: deploy
          images: ghcr.io/rso-ekipa-08/app-service:latest
          imagepullsecrets: registry-creds
          manifests: |
              app-service/k8s
