<!DOCTYPE html>
<html lang="sl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Digitalna trgovina - Domov</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="/public/css/app.css" rel="stylesheet" />
    </head>
    <body class="bg-gray-50">
        <nav class="bg-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex-shrink-0 flex items-center">
                        <span class="text-xl font-bold text-indigo-600">Digitalna trgovina</span>
                    </div>
                    <div class="flex items-center">
                        <div id="user-section">
                            <a href="/login" id="login-btn" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">Prijava</a>
                            <div id="user-info" style="display: none" class="flex items-center space-x-4">
                                <a href="/user" class="user-profile-link flex items-center space-x-2">
                                    <img id="user-avatar" class="h-8 w-8 rounded-full" alt="Profile picture" />
                                    <span id="user-name" class="text-gray-700"></span>
                                </a>
                                <button onclick="auth.logout()" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-indigo-600 bg-white hover:bg-gray-50 border-indigo-600">
                                    Odjava
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-8">Popularne aplikacije</h1>

            <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label for="category-filter" class="block text-sm font-medium text-gray-700 mb-2">Kategorija</label>
                        <select id="category-filter" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                            <option value="">Vse kategorije</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">Cenovni razpon</label>
                        <div class="grid grid-cols-2 gap-4">
                            <input
                                type="number"
                                id="min-price"
                                placeholder="Min cena"
                                class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                            />
                            <input
                                type="number"
                                id="max-price"
                                placeholder="Max cena"
                                class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                            />
                        </div>
                    </div>
                    <div class="flex items-end">
                        <button onclick="applyFilters()" class="w-full inline-flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">
                            Filtriraj
                        </button>
                    </div>
                </div>
            </div>

            <div id="apps-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Apps will be loaded here -->
            </div>
        </main>
        <script>
            // Add service URLs from environment
            window.APP_SERVICE_URL = "/api/app";
            window.REVIEWS_SERVICE_URL = "/api/reviews";
        </script>
        <script src="/public/js/auth.js"></script>
        <script src="/public/js/apps.js"></script>
    </body>
</html>
